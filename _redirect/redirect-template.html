<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting to {{ new_domain }}</title>
  <meta http-equiv="refresh" content="3; url={{ protocol }}{{ new_domain }}{{ path }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/redirect.css" />
  <script src="/_redirect/redirect-config.js"></script>
</head>
<body>
  <div class="container">
    <h1>Moved to {{ new_domain }}</h1>
    <p>This page has moved to a new domain.</p>
    <p>If you are not redirected automatically in 3 seconds, please <a id="manual-link">click here</a>.</p>
    <p>Old domain: <code>{{ old_domain }}</code><br />
       New domain: <code>{{ new_domain }}</code></p>
  </div>
  <script>
    const newUrl = REDIRECT_CONFIG.PROTOCOL + REDIRECT_CONFIG.NEW_DOMAIN + window.location.pathname + window.location.search;
    document.getElementById('manual-link').addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = newUrl;
    });
    window.location.href = newUrl;
  </script>
</body>
</html>
